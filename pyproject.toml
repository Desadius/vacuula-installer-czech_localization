[project]
name = "vacuula-installer"
version = "0.1.0"
description = "Install Vacuula on your Neato robot"
readme = "README.md"
authors = [
    {   name = "Max", email = "max.vacuula@eterkludd.se" },
    {   name = "Fjalar", email = "fjalarhognason@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.6",
    "pyusb>=1.3.1",
    "requests>=2.34.2",
    "pyserial>=3.5",
    "zeroconf>=0.151.5",
]

[project.scripts]
vacuula-installer = "vacuula_installer:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.ty.environment]
python = ".venv"

[dependency-groups]
dev = [
    "ruff>=0.16.8",
    "ty>=0.0.81",
]
