name: Build Desktop App

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  APP_NAME: VacuulaInstaller
  PYTHON_VERSION: "3.11"

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 is the current LTS runner; ubuntu-22.04 images
        # started deprecating in Sept 2026. For maximum glibc
        # compatibility across older Linux distros, consider building
        # inside a manylinux Docker container instead (see notes).
        os: [ubuntu-24.04, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Use uv for deps and cache lock file
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # PySide6's "xcb" platform plugin needs these at runtime, and not
      # all of them are preinstalled on the minimal Linux runner image.
      # pyusb needs libusb-1.0 at runtime too.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libusb-1.0-0 \
            libgl1 \
            patchelf \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0

      # macOS doesn't ship libusb by default; pyusb needs it at runtime.
      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: brew install libusb

      # Omit dev deps and fail on stale lock file
      - name: Install Python dependencies
        run: uv sync --locked --no-dev

      # Need pillow for app icon file format conversion
      - name: Build with PyInstaller
        run: >-
          uv run --locked --no-dev
          --with pyinstaller
          --with pillow
          pyinstaller --noconfirm --clean app.spec

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "dist/${{ env.APP_NAME }}.exe" "${{ env.APP_NAME }}-windows.exe"

      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r -y "../${{ env.APP_NAME }}-macos.zip" "${{ env.APP_NAME }}.app"

      # --- Linux: wrap the onedir build into an AppImage --------------
      - name: Build AppDir for AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p AppDir/usr/bin
          cp -r "dist/${{ env.APP_NAME }}"/. AppDir/usr/bin/
          chmod +x "AppDir/usr/bin/${{ env.APP_NAME }}"
          cp src/assets/logo.svg vacuula-installer.svg

          cat > "${{ env.APP_NAME }}.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=${{ env.APP_NAME }}
          Exec=${{ env.APP_NAME }}
          Icon=vacuula-installer
          StartupWMClass=${{ env.APP_NAME }}
          Categories=Utility;
          EOF

      - name: Download linuxdeploy (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      # Deliberately NOT using linuxdeploy's "qt" plugin: PyInstaller
      # already bundles PySide6's own Qt plugins, and its runtime hook
      # points Qt at that bundled copy regardless of what else sits
      # alongside it - so layering the qt plugin on top wouldn't change
      # what the app actually loads. It also expects Qt libraries under
      # usr/lib/, a layout PyInstaller's onedir output doesn't use, and
      # real-world reports of that mismatch (linuxdeploy-plugin-qt#200)
      # show it can break platform-plugin loading rather than help.
      # Plain linuxdeploy still earns its place here: proper AppRun
      # generation, desktop/icon integration, and a safety-net scan for
      # any system library PyInstaller's own hooks might have missed.
      - name: "Package artifact (Linux): build AppImage"
        if: runner.os == 'Linux'
        run: |
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            --executable "AppDir/usr/bin/${{ env.APP_NAME }}" \
            --desktop-file "${{ env.APP_NAME }}.desktop" \
            --icon-file vacuula-installer.svg \
            --output appimage
          mv "${{ env.APP_NAME }}"-*.AppImage "${{ env.APP_NAME }}-linux.AppImage"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ runner.os }}
          path: ${{ env.APP_NAME }}-*
          if-no-files-found: error

  # Only runs on an actual version-tag push (not workflow_dispatch),
  # since a release needs a tag to attach to. Gathers the three
  # per-OS zips produced above and publishes them as downloadable
  # assets on a GitHub Release for that tag.
  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create a release / upload assets
    steps:
      - name: Download all build artifacts into one folder
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.APP_NAME }}-*
          path: release-assets
          merge-multiple: true

      - name: Create/update release with assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          # GITHUB_TOKEN is provided automatically; no secret to configure
