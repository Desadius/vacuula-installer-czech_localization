name: Build Desktop App

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  APP_NAME: VacuulaInstaller
  ENTRY_POINT: main.py
  PYTHON_VERSION: "3.11"

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 is the current LTS runner; ubuntu-22.04 images
        # started deprecating in Sept 2026. For maximum glibc
        # compatibility across older Linux distros, consider building
        # inside a manylinux Docker container instead (see notes).
        os: [ubuntu-24.04, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # PySide6's "xcb" platform plugin needs these at runtime, and not
      # all of them are preinstalled on the minimal Linux runner image.
      # pyusb needs libusb-1.0 at runtime too.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libusb-1.0-0 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0

      # macOS doesn't ship libusb by default; pyusb needs it at runtime.
      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: brew install libusb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "PySide6>=6.6" "pyusb>=1.3.1" "requests>=2.34.2" "pyserial>=3.5" pyinstaller

      - name: Build with PyInstaller (Windows & Linux, one-file)
        if: runner.os != 'macOS'
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "${{ env.APP_NAME }}"
          "${{ env.ENTRY_POINT }}"

      # On macOS, --onefile is skipped so PyInstaller produces a proper
      # .app bundle (needed for a normal double-click launch from Finder).
      - name: Build with PyInstaller (macOS, app bundle)
        if: runner.os == 'macOS'
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name "${{ env.APP_NAME }}"
          "${{ env.ENTRY_POINT }}"

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/${{ env.APP_NAME }}.exe" -DestinationPath "${{ env.APP_NAME }}-windows.zip"

      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          zip -r "../${{ env.APP_NAME }}-linux.zip" "${{ env.APP_NAME }}"

      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r -y "../${{ env.APP_NAME }}-macos.zip" "${{ env.APP_NAME }}.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ runner.os }}
          path: ${{ env.APP_NAME }}-*.zip
          if-no-files-found: error

  # Only runs on an actual version-tag push (not workflow_dispatch),
  # since a release needs a tag to attach to. Gathers the three
  # per-OS zips produced above and publishes them as downloadable
  # assets on a GitHub Release for that tag.
  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create a release / upload assets
    steps:
      - name: Download all build artifacts into one folder
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.APP_NAME }}-*
          path: release-assets
          merge-multiple: true

      - name: Create/update release with assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.zip
          # GITHUB_TOKEN is provided automatically; no secret to configure
