  <!-- robot vacuum, top-down wireframe -->
  <circle cx="326" cy="118" r="58"/>
  <circle cx="326" cy="118" r="20" stroke-dasharray="4 5" opacity="0.8"/>
  <circle cx="326" cy="118" r="5" fill="#9d8fc9" stroke="none"/>

  <!-- USB port marker on the robot -->
