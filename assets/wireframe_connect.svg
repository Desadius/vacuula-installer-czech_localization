<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg"
     fill="none" stroke="#9d8fc9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

  <!-- laptop -->
  <rect x="24" y="66" width="118" height="78" rx="6"/>
  <rect x="38" y="78" width="90" height="54" rx="3" opacity="0.7"/>
  <line x1="12" y1="144" x2="154" y2="144"/>
  <line x1="24" y1="144" x2="18" y2="152"/>
  <line x1="142" y1="144" x2="148" y2="152"/>

  <!-- USB connector on the laptop -->
  <rect x="132" y="118" width="14" height="16" rx="2" stroke-dasharray="0"/>

  <!-- USB cable -->
  <path d="M146 126 C 190 126, 190 70, 232 70 C 262 70, 258 108, 296 108"
