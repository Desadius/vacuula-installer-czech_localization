  <!-- subtle direction sensors around the robot's rim -->
  <line x1="326" y1="60" x2="326" y2="70" opacity="0.6"/>
  <line x1="384" y1="118" x2="374" y2="118" opacity="0.6"/>
  <line x1="326" y1="176" x2="326" y2="166" opacity="0.6"/>
</svg>
